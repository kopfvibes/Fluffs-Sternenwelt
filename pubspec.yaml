name: fluffs_sternenwelt
description: Fluffs Sternenwelt – kleine Aufgaben, große Schritte.
publish_to: none
version: 5.2.2+56
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  crypto: ^3.0.6
  cryptography: ^2.9.0
  pdf: ^3.11.3
  printing: ^5.14.2
  # PDF 3.11.x needs archive <4.1.0. Image 4.11+ requires the
  # incompatible archive >=4.4 API; retain the last compatible image release.
  image: 4.10.2
  intl: ^0.20.2
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.5
  file_picker: ^10.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/coloring/
    - assets/audio/fluff/
    - assets/audio/pro/
    - assets/audio/narration/
    - assets/audio/sfx/
    - assets/audio/music/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
