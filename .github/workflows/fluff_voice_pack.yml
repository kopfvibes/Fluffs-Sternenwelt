name: FLUFF Originalstimme – zusätzliche Offline-Aufnahmen
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Kostenpflichtige HeyGen-Tonaufnahmen erzeugen? Genau GENERATE eingeben'
        type: string
        required: true
      limit:
        description: 'Maximale Zahl neuer Tonaufnahmen je Durchlauf (1 bis 20)'
        type: choice
        required: true
        default: '10'
        options: ['1', '5', '10', '20']
permissions:
  contents: write
jobs:
  voice-pack:
    if: ${{ github.event.inputs.confirm == 'GENERATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluff-v5-pro-entdeckerwelt
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aufnahmegenerator überprüfen
        run: |
          python3 -m py_compile scripts/build_fluff_voice_pack.py
          python3 scripts/build_fluff_voice_pack.py
          ffmpeg -version | head -n 1
      - name: Fluff-Aufnahmen aus privater HeyGen-Stimme erzeugen
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          FLUFF_LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$HEYGEN_API_KEY" ]; then
            echo "HEYGEN_API_KEY fehlt als GitHub Actions Repository Secret." >&2
            exit 1
          fi
          python3 scripts/build_fluff_voice_pack.py --generate --limit "$FLUFF_LIMIT"
      - name: Neue Offline-Aufnahmen sicher im Entwicklungszweig speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/narration lib/services/offline_fluff_narration.dart
          if ! git diff --cached --quiet; then
            git commit -m "Add original Fluff offline narration clips"
            git push origin HEAD:fluff-v5-pro-entdeckerwelt
          fi
